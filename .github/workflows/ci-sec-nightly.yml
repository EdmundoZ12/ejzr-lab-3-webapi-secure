name: CI - Nightly - Spring Boot DevSecOps

on:
  schedule:
    - cron: '30 23 * * *'
      timezone: 'America/La_Paz'
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx2g'

jobs:
  nightly-sca:
    name: Nightly SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Cache Dependency-Check database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ runner.os }}
          restore-keys: |
            dependency-check-data-

      - name: Build and test
        run: mvn -B clean verify

      - name: Run OWASP Dependency-Check
        id: dependency-check
        continue-on-error: true
        run: |
          mvn -B org.owasp:dependency-check-maven:11.1.1:check \
            -DfailBuildOnCVSS=7

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: warn
          retention-days: 14

      - name: Quality Gate - SCA
        if: always()
        shell: bash
        run: |
          echo "====================================="
          echo "        NIGHTLY SCA QUALITY GATE"
          echo "====================================="
          echo "Dependency-Check: ${{ steps.dependency-check.outcome }}"
          echo "====================================="

          if [[ "${{ steps.dependency-check.outcome }}" != "success" ]]; then
            echo "::error::Dependency-Check detectó vulnerabilidades con CVSS >= 7"
            exit 1
          fi

          echo "SCA Quality Gate PASSED"